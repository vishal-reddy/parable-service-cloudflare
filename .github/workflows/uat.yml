name: Test Environment

# Every pull request deploys to the single, stable test backend at
# parable-test.kecker.co (Wrangler env `test`, worker
# `parable-service-cloudflare-test`, D1 `parable-db-test`). All PRs share this
# environment — the most recent push wins. Merges to main deploy prod (ci.yml).

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

concurrency:
  group: test-deploy
  cancel-in-progress: false

permissions:
  pull-requests: write

jobs:
  deploy-test:
    name: Deploy to test (parable-test.kecker.co)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Run D1 migrations (test)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply parable-db-test --remote --env test

      # Non-fatal: the test DB now holds the full Puritan corpus (migrated from the
      # legacy service), so re-seeding the sample rows conflicts on primary keys.
      # Kept for provisioning a fresh/empty test DB, but must not fail the deploy.
      - name: Seed test database
        continue-on-error: true
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute parable-db-test --remote --env test --file=scripts/seed.sql

      - name: Build CSS
        run: npm run css:build

      - name: Deploy test worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env test

      - name: Comment test URL on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            <!-- test-deploy -->
            ## 🧪 Deployed to the test environment

            This PR is live on the shared test backend (all PRs share it — latest push wins):

            | Resource | URL |
            |----------|-----|
            | **Test API** | https://parable-test.kecker.co |
            | **Health** | https://parable-test.kecker.co/health |

            Test builds of the app (dev flavor) point here. Merging to `main` deploys prod.

            _Last deployed: ${{ github.sha }} · [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_
          edit-mode: replace
