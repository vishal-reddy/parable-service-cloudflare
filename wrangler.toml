#:schema node_modules/wrangler/config-schema.json
name = "parable-service-cloudflare"
main = "src/index.ts"
compatibility_date = "2025-04-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

assets = { directory = "./public" }

routes = [
  { pattern = "parable.kecker.co", custom_domain = true }
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "parable-db"
database_id = "427dbb4b-072e-4fdd-bef5-57bb454fb39e"
migrations_dir = "src/db/migrations"

# Full Puritan work text (too large for D1 — ~12 GB). D1 keeps metadata + a short
# snippet for search; the complete markdown lives in R2, keyed by work file_path.
# Shared read-only bucket bound to both prod and test.
[[r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "parable-puritan-content"

[vars]
ENVIRONMENT = "production"
# Legacy-contract compat shaping so pinned 1.0.0 mobile clients can be served
# entirely from Cloudflare, letting the DigitalOcean backend + Postgres retire.
# Set to "off" to serve only the CF-native shape. Reversible without a schema change.
LEGACY_CONTRACT_COMPAT = "on"
# Admin allowlist for /api/admin (trueconfessions.app/admin dashboard).
ADMIN_EMAILS = "vlukereddy@gmail.com"
# Repo where translation-feedback submissions open triage issues. The GITHUB_TOKEN
# secret (fine-grained PAT, Issues:write) enables it; set it only on prod so test/dev
# submissions don't create real issues: `wrangler secret put GITHUB_TOKEN`.
GITHUB_ISSUES_REPO = "KeckerCo/true-confessions-compose-multiplatform"

# ─── Stable test environment ─────────────────────────────────────────────────
# A separate worker (`parable-service-cloudflare-test`) at parable-test.kecker.co
# with its own D1 database. All PRs deploy here (see .github/workflows/uat.yml);
# merges to main deploy prod (ci.yml). KINDE_AUDIENCE is identical to prod so the
# same Kinde logins/tokens work against test ("same auth as production").
# Mobile-app auth (Bearer-token validation in src/middleware/auth.ts) only needs
# KINDE_DOMAIN + KINDE_AUDIENCE, both set below — so the app's logins/tokens work
# against test with no extra setup. KINDE_CLIENT_SECRET and SESSION_SECRET are
# only used by the backend's own *web* login flow (src/routes/auth.ts); set them
# with `wrangler secret put <NAME> --env test` if you need web login on test.
[env.test]
name = "parable-service-cloudflare-test"
routes = [
  { pattern = "parable-test.kecker.co", custom_domain = true }
]

[env.test.vars]
ENVIRONMENT = "test"
LEGACY_CONTRACT_COMPAT = "on"
ADMIN_EMAILS = "vlukereddy@gmail.com"
KINDE_DOMAIN = "https://kecker.kinde.com"
KINDE_AUDIENCE = "https://parable.kecker.co"
KINDE_CLIENT_ID = "7a1247c4fc50464b90aeb81c20cfe5fe"

[[env.test.d1_databases]]
binding = "DB"
database_name = "parable-db-test"
database_id = "bac45704-d6c6-4faf-87d9-5d4945bf5ccf"
migrations_dir = "src/db/migrations"

# Same shared R2 bucket as prod (Puritan content is identical read-only data).
[[env.test.r2_buckets]]
binding = "CONTENT_BUCKET"
bucket_name = "parable-puritan-content"
